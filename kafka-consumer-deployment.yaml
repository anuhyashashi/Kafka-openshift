apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: anuhyashashi/kafka-consumer:v14
          imagePullPolicy: Always
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/messages"
          ports:
            - containerPort: 8080
